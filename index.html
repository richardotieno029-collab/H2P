<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Housing Finder</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <header>
        <h1>Campus Housing Finder</h1>
        <nav>
            <a href="#">Home</a>
            <a href="#">Areas</a>
            <a href="#">About</a>
            <a href="#">Contact</a>
            <a href="#" id="fav-link">❤ Favorites</a>
        </nav>
    </header>

    <!-- HERO SECTION -->
    <section class="hero">
        <h2>Find the best rooms around your university</h2>
        <p>Search, compare, and book rooms with ease.</p>
    </section>

    <!-- SEARCH + FILTERS -->
    <section class="search-area">
        <input type="text" id="searchInput" placeholder="Search by area or house name...">
        
        <select id="filterPrice">
            <option value="">Price Range</option>
            <option value="0-3000">0 - 3000</option>
            <option value="3000-5000">3000 - 5000</option>
            <option value="5000-8000">5000 - 8000</option>
        </select>

        <select id="filterType">
            <option value="">Room Type</option>
            <option value="single">Single</option>
            <option value="bedsitter">Bedsitter</option>
            <option value="onebed">1 Bedroom</option>
        </select>
    </section>
<!-- AREAS SECTION -->
<section class="areas-section">
    <h2>Select Your Area</h2>
    <div class="areas-list">
        <a href="kangaru.html" class="area-card">Kangaru</a>
        <a href="kamiu.html" class="area-card">Kamiu</a>
        <a href="gakwegori.html" class="area-card">Gakwegori</a>
        <a href="springvalley.html" class="area-card">Spring Valley</a>
        <a href="kayole.html" class="area-card">Kayole</a>
    </div>
</section>
    <!-- ROOM LISTINGS -->
    <section class="rooms" id="rooms-container">
        <!-- Dynamically generated by JS -->
    </section>

    <script src="script.js"></script>
</body>
</html>
