<!DOCTYPE html>
<html>
<head>
    <title>Add New Room</title>
</head>
<body>

<h2>Add a House / Room</h2>

<form action="upload_room.php" method="POST" enctype="multipart/form-data">

    <label>Room Name:</label><br>
    <input type="text" name="room_name" required><br><br>

    <label>Price:</label><br>
    <input type="number" name="price" required><br><br>

    <label>Description:</label><br>
    <textarea name="description" required></textarea><br><br>

    <label>Image:</label><br>
    <input type="file" name="room_image" accept="image/*" required><br><br>

    <button type="submit">Upload Room</button>

</form>

</body>
</html>
